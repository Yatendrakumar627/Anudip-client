<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1740" />
    <meta name="description" content="LMS Student Portal, Google Meet Attendance & Training Hub for Anudip Foundation." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" />
    <title>Anudip Foundation · Training & LMS Hub</title>
  </head>
  <body>
    <div id="root">
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f6f8fc;font-family:'DM Sans',system-ui,sans-serif;padding:20px;box-sizing:border-box;">
        <div style="text-align:center;max-width:340px;width:100%;background:#ffffff;padding:36px 28px;border-radius:24px;box-shadow:0 12px 32px rgba(15,23,42,0.06);border:1px solid #e2e8f0;box-sizing:border-box;">
          <div style="width:50px;height:50px;margin:0 auto 16px;border-radius:50%;border:3.5px solid #e0e7ff;border-top-color:#4f46e5;border-right-color:#06b6d4;animation:anudipInitSpin 0.9s cubic-bezier(0.68,-0.55,0.27,1.55) infinite;"></div>
          <div style="font-weight:750;font-size:17px;color:#18233c;letter-spacing:-0.01em;margin-bottom:6px;">Anudip Training Hub</div>
          <div style="font-size:12px;color:#64748b;line-height:1.5;">Preparing learning workspace & student portal...</div>
        </div>
      </div>
      <style>
        @keyframes anudipInitSpin { to { transform: rotate(360deg); } }
      </style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
